name: CI – FastAPI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      # Récupérer le code
      - name: Checkout code
        uses: actions/checkout@v4
      # Configurer Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # Installer les dépendances dev
      - name: Install dependencies (dev)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip list
        #Linting - qualité du code
      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 app/test_api.py --count --select=E9,F63,F82 --show-source --statistics
          flake8 app/test_api.py --count --exit-zero --max-complexity=10 --max-length=88 --statistics
      # Tests unitaires / async
      - name: Run tests
        run: |
          export PYTHONPATH=$(pwd)
          pytest --maxfail=1 --disable-warnings -q --cov=app-report=xml --cov-report=ter-missing
      
    
      #Vérifier la sécurité des dépendances(optionnel)
      - name: Check for issues
        run: |
          safety check || true

