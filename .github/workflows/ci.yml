name: CI-FastAPI

on:
  pull_request:
    branches:[main]
  push:
    [main, dev]


permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24-04
    steps:
      #Récupérer le code
      -name: Checkout code
      uses: action/checkout@v4
      #Configurer Python
      -name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
      #Installer les dépendances dev
      -name: Install dependancies (dev)
      run:
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip list
      #Test unitaires / asunc
      -name: Run tests
      run:
        export PYTHONPATH=$(pwd)
        pytest --maxfail=1 --disable-warnings -q

